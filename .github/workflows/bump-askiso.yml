name: bump-askiso

# Keeps Casks/askiso.rb in sync with the latest github.com/sebastienrousseau/askiso
# release. Polls daily (no cross-repo token needed); can also be run on demand or
# triggered instantly by a repository_dispatch of type "askiso-release".
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [askiso-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure signed commits
        env:
          SIGNING_KEY: ${{ secrets.TAP_SIGNING_SSH_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAP_SIGNING_SSH_KEY secret is not set; the bumper needs an SSH signing key so its commits verify."
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" > "$HOME/.tap_signing_key"
          chmod 600 "$HOME/.tap_signing_key"
          git config user.name "Sebastien Rousseau"
          git config user.email "sebastian.rousseau@gmail.com"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.tap_signing_key"
          git config commit.gpgsign true

      - name: Bump askiso cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="sebastienrousseau/askiso"
          tag="$(gh release view --repo "$repo" --json tagName -q .tagName)"
          ver="${tag#v}"
          cur="$(sed -n 's/.*version "\([^"]*\)".*/\1/p' Casks/askiso.rb | head -1)"
          echo "Checking askiso cask: $cur -> $ver"
          gh release download "$tag" --repo "$repo" --pattern checksums.txt --dir "$RUNNER_TEMP" --clobber
          VER="$ver" SUMS="$RUNNER_TEMP/checksums.txt" python3 - <<'PY'
          import os, re
          ver, sums = os.environ["VER"], os.environ["SUMS"]
          shas = {}
          for line in open(sums):
              digest, name = line.split()
              shas[name] = digest
          platforms = ("darwin_arm64", "darwin_amd64", "linux_arm64", "linux_amd64")
          want = {p: shas.get(f"askiso_{ver}_{p}.tar.gz") for p in platforms}
          missing = [p for p, d in want.items() if not d]
          if missing:
              raise SystemExit(f"missing a checksum for {ver}: {missing}")
          path = "Casks/askiso.rb"
          lines = open(path).readlines()
          out = []
          for index, line in enumerate(lines):
              if line.lstrip().startswith('version "'):
                  line = re.sub(r'version "[^"]*"', f'version "{ver}"', line)
              elif line.lstrip().startswith("sha256 "):
                  following = "".join(lines[index + 1:index + 4])
                  match = re.search(r"_(darwin_arm64|darwin_amd64|linux_arm64|linux_amd64)\.tar\.gz", following)
                  if not match:
                      raise SystemExit("sha256 line is not followed by a platform URL")
                  line = re.sub(r'sha256 "[^"]*"', f'sha256 "{want[match.group(1)]}"', line)
              out.append(line)
          open(path, "w").writelines(out)
          PY
          if git diff --quiet -- Casks/askiso.rb; then
            echo "Casks/askiso.rb is already correct for $ver; nothing to do."
            exit 0
          fi
          branch="automation/askiso-v${ver}"
          if gh pr list --head "$branch" --state open --json number --jq 'length > 0' | grep -q true; then
            echo "An updater pull request for $ver is already open."
            exit 0
          fi
          git switch -c "$branch"
          git commit -am "askiso: bump to $ver"
          git push --set-upstream origin "$branch"
          pr="$(gh pr create --base main --head "$branch" \
            --title "askiso: bump to $ver" \
            --body "Automated cask update for askiso v$ver.")"
          gh pr merge "$pr" --squash --delete-branch

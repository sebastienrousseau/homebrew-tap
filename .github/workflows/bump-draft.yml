name: bump-draft

# Keeps Formula/draft.rb in sync with the latest github.com/sebastienrousseau/draft
# release. Polls daily (no cross-repo token needed); can also be run on demand or
# triggered instantly by a repository_dispatch of type "draft-release".
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [draft-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure signed commits
        env:
          SIGNING_KEY: ${{ secrets.TAP_SIGNING_SSH_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAP_SIGNING_SSH_KEY secret is not set; the bumper needs an SSH signing key so its commits verify."
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" > "$HOME/.tap_signing_key"
          chmod 600 "$HOME/.tap_signing_key"
          git config user.name "Sebastien Rousseau"
          git config user.email "sebastian.rousseau@gmail.com"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.tap_signing_key"
          git config commit.gpgsign true

      - name: Bump draft formula to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="sebastienrousseau/draft"
          tag="$(gh release view --repo "$repo" --json tagName -q .tagName)"
          ver="${tag#v}"
          cur="$(sed -n 's/.*version "\([^"]*\)".*/\1/p' Formula/draft.rb | head -1)"
          echo "Checking draft formula: $cur -> $ver"
          gh release download "$tag" --repo "$repo" --pattern checksums.txt --dir "$RUNNER_TEMP" --clobber
          sum() { awk -v f="draft_${ver}_$1.tar.gz" '$2==f{print $1}' "$RUNNER_TEMP/checksums.txt"; }
          DA="$(sum darwin_arm64)"
          DI="$(sum darwin_amd64)"
          LA="$(sum linux_arm64)"
          LI="$(sum linux_amd64)"
          export DA DI LA LI
          for v in "$DA" "$DI" "$LA" "$LI"; do
            [ -n "$v" ] || { echo "::error::missing a checksum for $ver"; exit 1; }
          done
          VER="$ver" python3 - <<'PY'
          import os, re
          ver = os.environ["VER"]
          shas = {"darwin_arm64": os.environ["DA"], "darwin_amd64": os.environ["DI"],
                  "linux_arm64": os.environ["LA"], "linux_amd64": os.environ["LI"]}
          path = "Formula/draft.rb"
          lines = open(path).readlines()
          out = []
          for index, line in enumerate(lines):
              if line.lstrip().startswith('version "'):
                  line = re.sub(r'version "[^"]*"', f'version "{ver}"', line)
              elif line.lstrip().startswith("sha256 "):
                  adjacent = "".join(lines[max(0, index - 1):index] + lines[index + 1:index + 2])
                  match = re.search(
                      r"_(darwin_arm64|darwin_amd64|linux_arm64|linux_amd64)\.tar\.gz",
                      adjacent,
                  )
                  if not match:
                      raise SystemExit("sha256 line is not adjacent to a platform URL")
                  line = re.sub(r'sha256 "[^"]*"', f'sha256 "{shas[match.group(1)]}"', line)
              out.append(line)
          open(path, "w").writelines(out)
          PY
          if git diff --quiet -- Formula/draft.rb; then
            echo "Formula/draft.rb is already correct for $ver; nothing to do."
            exit 0
          fi
          branch="automation/draft-v${ver}"
          if gh pr list --head "$branch" --state open --json number --jq 'length > 0' | grep -q true; then
            echo "An updater pull request for $ver is already open."
            exit 0
          fi
          git switch -c "$branch"
          git commit -am "draft: bump to $ver"
          git push --set-upstream origin "$branch"
          pr="$(gh pr create --base main --head "$branch" \
            --title "draft: bump to $ver" \
            --body "Automated formula update for draft v$ver.")"
          gh pr merge "$pr" --squash --delete-branch
